<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portugal Wedding Videographers | Katy & Eugene</title>
    <link rel="canonical" href="https://portugalweddingvideographer.com/" />
  </head>
  <body>
    <header class="h-24 w-full bg-white">
      <nav class="mx-auto flex h-full max-w-7xl items-center justify-between px-6">
        <!-- Desktop Logo -->
        <a href="/" aria-label="Portugal Wedding Videographer" class="hidden md:block">
          <img
            src="/images/logo/portugal-wedding-videographer-logo.svg"
            alt="Portugal Wedding Videographer Logo"
            class="h-10 w-auto"
          />
        </a>
        <!-- Mobile Logo -->
        <a href="/" aria-label="Portugal Wedding Videographer" class="block md:hidden">
          <img
            src="/images/logo/portugal-wedding-videographer-mobile-logo.svg"
            alt="Portugal Wedding Videographer Logo"
            class="h-16 w-auto"
          />
        </a>

        <!-- Desktop Navigation -->
        <ul class="hidden items-center gap-8 text-sm md:flex">
          <li>
            <a href="/portfolio/" class="transition hover:opacity-70">Portfolio</a>
          </li>

          <li>
            <a href="/services/" class="transition hover:opacity-70">Services</a>
          </li>

          <li>
            <a href="/blog/" class="transition hover:opacity-70">Blog</a>
          </li>

          <li>
            <a href="/about/" class="transition hover:opacity-70">About</a>
          </li>

          <li>
            <a href="/contact/" class="transition hover:opacity-70"> Contact </a>
          </li>
        </ul>

        <!-- Mobile Menu Button -->
        <button id="mobile-menu-button" aria-label="Open Mobile Menu" class="md:hidden">
          <img
            id="hamburger-icon"
            src="/images/navbar/hamburger-closed.svg"
            alt="Mobile Menu"
            class="h-8 w-8 transition-opacity duration-300"
          />
        </button>
        <!-- Dark Overlay -->

        <div id="mobile-overlay" class="fixed inset-0 z-40 hidden bg-black/30 transition-opacity duration-500"></div>

        <!-- Mobile Navigation -->

        <div
          id="mobile-menu"
          class="fixed right-0 top-0 z-50 h-screen w-2/3 translate-x-full bg-white shadow-xl transition-transform duration-200 md:hidden"
        >
          <div class="flex justify-end p-6">
            <button id="mobile-menu-close" aria-label="Close Mobile Menu">
              <img src="/images/navbar/hamburger-open.svg" alt="Close Menu" class="h-8 w-8" />
            </button>
          </div>

          <ul class="text-center flex flex-col gap-10 px-10 pt-10 text-xl">
            <li><a href="/portfolio/">Portfolio</a></li>

            <li><a href="/services/">Services</a></li>

            <li><a href="/blog/">Blog</a></li>

            <li><a href="/about/">About</a></li>

            <li>
              <a href="/contact/" class="transition hover:opacity-70"> Contact </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
